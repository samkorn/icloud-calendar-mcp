[project]
name = "icloud-calendar-mcp"
version = "0.1.0"
description = "Remote MCP server giving Claude read/write access to iCloud calendars, hosted on Modal."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "caldav>=3.7.0",
    "fastmcp>=4.1.8",
    "icalendar>=7.3.0",
    "icalendar-searcher>=1.3.0",
    "modal>=1.6.4",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
