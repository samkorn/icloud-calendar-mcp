name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays around 9 AM Eastern (the time is in UTC), so an advisory
    # against a pinned package shows up even when nothing was pushed.
    - cron: '0 14 * * 1'

# Nothing here needs secrets or write access, so it is safe to run on pull
# requests from forks.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit: a tag can be moved, a commit can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
      - run: uv sync --frozen
      - run: uv run --frozen pytest

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.5'
      # The packages a deployment installs, checked against known
      # vulnerabilities by exact version and hash.
      - run: >
          uv export --frozen --no-dev --no-emit-project
          --format requirements-txt --output-file requirements.txt
      - run: >
          uv tool run pip-audit@2.10.1 --require-hashes --disable-pip
          -r requirements.txt
